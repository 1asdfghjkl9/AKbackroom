<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK BACKROOM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;user-select:none}
body{overflow:hidden;background:#000;color:#fff;cursor:default}
canvas{display:block}
#gameCanvas{position:fixed;top:0;left:0;z-index:1}

/* HUD */
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;display:none}
#hud.active{display:block}

/* Health & SAN */
#statsContainer{position:absolute;bottom:20px;left:20px;width:220px}
.barWrap{margin-bottom:8px}
.barLabel{font-size:11px;color:#aaa;margin-bottom:2px;display:flex;justify-content:space-between}
.barBg{height:14px;background:rgba(0,0,0,0.6);border:1px solid #333;border-radius:7px;overflow:hidden}
.barFill{height:100%;transition:width 0.3s;border-radius:6px}
#healthBar{background:linear-gradient(90deg,#ff0000,#ff5555)}
#sanBar{background:linear-gradient(90deg,#6a0dad,#9932cc)}
#expBar{background:linear-gradient(90deg,#006400,#32cd32);height:6px}
.barFill.low{animation:pulse 0.5s infinite alternate}
@keyframes pulse{from{opacity:0.6}to{opacity:1}}

/* Weapon */
#weaponInfo{position:absolute;bottom:20px;right:20px;text-align:right}
#weaponName{font-size:16px;font-weight:bold;color:#fff;text-shadow:0 0 4px #000}
#ammoDisplay{font-size:28px;font-weight:bold;color:#ffcc00;text-shadow:0 0 4px #000}
#ammoDisplay .reserve{font-size:16px;color:#aaa}
#weaponList{font-size:11px;color:#888;margin-top:4px}

/* Skills */
#skillBar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.skillSlot{width:48px;height:48px;background:rgba(0,0,0,0.6);border:2px solid #444;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.skillSlot.ready{border-color:#4a9;border-color:rgba(68,170,153,0.8)}
.skillSlot.onCooldown{opacity:0.5}
.skillIcon{font-size:22px}
.skillKey{font-size:9px;color:#888;position:absolute;bottom:1px}
.skillCD{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;color:#fff;background:rgba(0,0,0,0.7);border-radius:6px;display:none}
#ultimateSlot{width:56px;height:56px;border-color:#a44}
#ultimateSlot.ready{border-color:#f44;box-shadow:0 0 10px #f44}

/* Crosshair */
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.cross-dot{width:4px;height:4px;background:#0f0;border-radius:50%;box-shadow:0 0 2px #000}
.cross-line{position:absolute;background:#0f0;box-shadow:0 0 2px #000}
#crossTop{top:-12px;left:-1px;width:2px;height:8px}
#crossBot{top:4px;left:-1px;width:2px;height:8px}
#crossLeft{top:-1px;left:-12px;width:8px;height:2px}
#crossRight{top:-1px;left:4px;width:8px;height:2px}

/* Minimap */
#minimap{position:absolute;top:15px;left:15px;width:150px;height:150px;background:rgba(0,0,0,0.6);border:1px solid #333;border-radius:4px}
#minimapCanvas{width:100%;height:100%}

/* Extract info */
#extractInfo{position:absolute;top:15px;right:15px;text-align:right;font-size:13px}
#extractStatus{color:#aaa}
#extractTimer{font-size:24px;font-weight:bold;color:#f44}
#killCount{color:#f80;font-size:14px;margin-top:4px}
#lootValue{color:#fd0;font-size:14px}

/* Interaction prompt */
#interactPrompt{position:absolute;top:55%;left:50%;transform:translateX(-50%);font-size:16px;color:#fff;text-shadow:0 0 6px #000;background:rgba(0,0,0,0.5);padding:4px 12px;border-radius:4px;display:none}

/* Damage indicator */
#damageVignette{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9;box-shadow:inset 0 0 100px rgba(255,0,0,0);transition:box-shadow 0.1s}

/* Message */
#messageBox{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:20px;font-weight:bold;text-shadow:0 0 8px #000;text-align:center;z-index:15;opacity:0;transition:opacity 0.3s}
#messageBox.show{opacity:1}

/* Menu */
#menuOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center}
#menuOverlay.hidden{display:none}
#gameTitle{font-size:64px;font-weight:bold;color:#c4a847;text-shadow:0 0 20px #c4a84780;letter-spacing:8px;margin-bottom:10px}
#gameSubtitle{font-size:16px;color:#888;margin-bottom:40px}
.menuBtn{width:240px;padding:12px;margin:5px;background:rgba(255,255,255,0.05);border:1px solid #444;color:#fff;font-size:16px;cursor:pointer;transition:all 0.2s;border-radius:4px}
.menuBtn:hover{background:rgba(255,255,255,0.15);border-color:#888}
.menuBtn.primary{background:rgba(196,168,71,0.2);border-color:#c4a847}
.menuBtn.primary:hover{background:rgba(196,168,71,0.3)}

/* Loading */
#loadingOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
#loadingOverlay.show{display:flex}
#loadingLevel{font-size:32px;color:#c4a847;margin-bottom:10px}
#loadingDesc{font-size:14px;color:#888;margin-bottom:30px;max-width:400px;text-align:center}
#loadingBar{width:300px;height:4px;background:#222;border-radius:2px;overflow:hidden}
#loadingBarFill{height:100%;background:#c4a847;animation:loadPulse 1.5s ease-in-out}
@keyframes loadPulse{0%{width:0}50%{width:70%}100%{width:100%}}

/* Pause */
#pauseOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center}
#pauseOverlay.show{display:flex}
#pauseTitle{font-size:36px;color:#fff;margin-bottom:30px}

/* Death */
#deathOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(20,0,0,0.9);z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center}
#deathOverlay.show{display:flex}
#deathTitle{font-size:48px;color:#f00;margin-bottom:20px;text-shadow:0 0 20px #f0080}
#deathStats{font-size:14px;color:#888;margin-bottom:30px;text-align:center}

/* Extract screen */
#extractOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,20,0,0.9);z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center}
#extractOverlay.show{display:flex}
#extractTitle{font-size:42px;color:#0f0;margin-bottom:20px}
#extractStats{font-size:16px;color:#ccc;margin-bottom:30px;text-align:center}

/* Inventory */
#inventoryOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:140;display:none;flex-direction:column;align-items:center;justify-content:center}
#inventoryOverlay.show{display:flex}
#invTitle{font-size:28px;color:#fff;margin-bottom:20px}
#invGrid{display:grid;grid-template-columns:repeat(4,80px);gap:8px;margin-bottom:20px}
.invSlot{width:80px;height:80px;background:rgba(255,255,255,0.05);border:1px solid #444;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
.invSlot:hover{border-color:#888;background:rgba(255,255,255,0.1)}
.invSlot.empty{opacity:0.3}
.invIcon{font-size:32px}
.invName{font-size:9px;color:#aaa;text-align:center;margin-top:2px}
.invCount{position:absolute;top:2px;right:4px;font-size:11px;color:#ff0}

/* Skill tree */
#skillTreeOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:140;display:none;flex-direction:column;align-items:center;justify-content:center}
#skillTreeOverlay.show{display:flex}

/* Shop */
#shopOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:140;display:none;flex-direction:column;align-items:center;justify-content:center}
#shopOverlay.show{display:flex}

/* Settings */
#settingsOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:140;display:none;flex-direction:column;align-items:center;justify-content:center}
#settingsOverlay.show{display:flex}

/* Jumpscare */
#jumpscare{position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;display:none;align-items:center;justify-content:center}
#jumpscare.show{display:flex}
#jumpscare canvas{max-width:100%;max-height:100%}

/* SAN effects */
#sanOverlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:8}
#sanVignette{position:absolute;top:0;left:0;width:100%;height:100%;box-shadow:inset 0 0 200px rgba(0,0,0,0);transition:box-shadow 0.5s}
#sanDistort{position:absolute;top:0;left:0;width:100%;height:100%;filter:blur(0) hue-rotate(0deg);transition:filter 0.5s}

/* Damage direction */
#damageDir{position:absolute;top:50%;left:50%;width:60px;height:60px;transform:translate(-50%,-50%);display:none}
</style>
</head>
<body>

<div id="hud">
  <div id="damageVignette"></div>
  <canvas id="minimapCanvas" width="150" height="150" style="position:absolute;top:15px;left:15px;background:rgba(0,0,0,0.6);border:1px solid #333;border-radius:4px"></canvas>
  
  <div id="statsContainer">
    <div class="barWrap">
      <div class="barLabel"><span>HP</span><span id="hpText">100/100</span></div>
      <div class="barBg"><div class="barFill" id="healthBar" style="width:100%"></div></div>
    </div>
    <div class="barWrap">
      <div class="barLabel"><span>SAN</span><span id="sanText">100/100</span></div>
      <div class="barBg"><div class="barFill" id="sanBar" style="width:100%"></div></div>
    </div>
    <div class="barWrap">
      <div class="barLabel"><span>LV <span id="levelText">1</span></span><span id="expText">0/100</span></div>
      <div class="barBg"><div class="barFill" id="expBar" style="width:0%"></div></div>
    </div>
  </div>
  
  <div id="weaponInfo">
    <div id="weaponName">P92</div>
    <div id="ammoDisplay"><span id="ammoCur">15</span> <span class="reserve">/ <span id="ammoRes">30</span></span></div>
    <div id="weaponList"></div>
  </div>
  
  <div id="skillBar">
    <div class="skillSlot" id="skill0"><div class="skillIcon">⚡</div><div class="skillKey">Q</div><div class="skillCD" id="cd0">0</div></div>
    <div class="skillSlot" id="skill1"><div class="skillIcon">💨</div><div class="skillKey">F</div><div class="skillCD" id="cd1">0</div></div>
    <div class="skillSlot" id="skill2"><div class="skillIcon">✨</div><div class="skillKey">G</div><div class="skillCD" id="cd2">0</div></div>
    <div class="skillSlot" id="ultimateSlot"><div class="skillIcon">⏰</div><div class="skillKey">X</div><div class="skillCD" id="cd3">0</div></div>
  </div>
  
  <div id="crosshair">
    <div class="cross-dot"></div>
    <div class="cross-line" id="crossTop"></div>
    <div class="cross-line" id="crossBot"></div>
    <div class="cross-line" id="crossLeft"></div>
    <div class="cross-line" id="crossRight"></div>
  </div>
  
  <div id="extractInfo">
    <div id="extractStatus"></div>
    <div id="extractTimer"></div>
    <div id="killCount">击杀: 0</div>
    <div id="lootValue">价值: 0</div>
  </div>
  
  <div id="interactPrompt">按 E 交互</div>
  <div id="messageBox"></div>
</div>

<div id="sanOverlay"><div id="sanVignette"></div><div id="sanDistort"></div></div>

<div id="menuOverlay">
  <div id="gameTitle">AK BACKROOM</div>
  <div id="gameSubtitle">搜打撤 × 后室 × 无畏契约技能 × 恐怖生存</div>
  <button class="menuBtn primary" onclick="startGame()">开始游戏</button>
  <button class="menuBtn" onclick="uiSystem.showShop()">商店</button>
  <button class="menuBtn" onclick="uiSystem.showSkillTree()">技能树</button>
  <button class="menuBtn" onclick="uiSystem.showSettings()">设置</button>
  <div id="menuStats" style="margin-top:20px;font-size:13px;color:#666"></div>
</div>

<div id="loadingOverlay">
  <div id="loadingLevel">Loading...</div>
  <div id="loadingDesc"></div>
  <div id="loadingBar"><div id="loadingBarFill"></div></div>
</div>

<div id="pauseOverlay">
  <div id="pauseTitle">已暂停</div>
  <button class="menuBtn primary" onclick="uiSystem.resume()">继续游戏</button>
  <button class="menuBtn" onclick="uiSystem.showSettings()">设置</button>
  <button class="menuBtn" onclick="backToMenu()">返回主菜单</button>
</div>

<div id="deathOverlay">
  <div id="deathTitle">你被后室吞噬了</div>
  <div id="deathStats"></div>
  <button class="menuBtn primary" onclick="restartGame()">重新开始</button>
  <button class="menuBtn" onclick="backToMenu()">返回主菜单</button>
</div>

<div id="extractOverlay">
  <div id="extractTitle">撤离成功</div>
  <div id="extractStats"></div>
  <button class="menuBtn primary" id="nextLevelBtn" onclick="nextLevel()">进入下一层</button>
  <button class="menuBtn" onclick="backToMenu()">返回主菜单</button>
</div>

<div id="inventoryOverlay">
  <div id="invTitle">背包</div>
  <div id="invGrid"></div>
  <button class="menuBtn" onclick="uiSystem.closeInventory()">关闭 (Tab)</button>
</div>

<div id="skillTreeOverlay">
  <div style="font-size:28px;color:#fff;margin-bottom:20px">技能树</div>
  <div id="skillTreeContent"></div>
  <button class="menuBtn" onclick="uiSystem.closeSkillTree()">关闭</button>
</div>

<div id="shopOverlay">
  <div style="font-size:28px;color:#fff;margin-bottom:20px">商店 <span id="shopCoins" style="color:#fd0"></span></div>
  <div id="shopContent"></div>
  <button class="menuBtn" onclick="uiSystem.closeShop()">关闭</button>
</div>

<div id="settingsOverlay">
  <div style="font-size:28px;color:#fff;margin-bottom:20px">设置</div>
  <div style="margin:10px 0">
    <label style="display:inline-block;width:120px">鼠标灵敏度</label>
    <input type="range" id="sensSlider" min="0.5" max="3" step="0.1" value="1" onchange="Game.sensitivity=this.value*0.002">
    <span id="sensVal">1.0</span>
  </div>
  <div style="margin:10px 0">
    <label style="display:inline-block;width:120px">音量</label>
    <input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.5" onchange="AudioSystem.setVolume(this.value)">
  </div>
  <button class="menuBtn" onclick="uiSystem.closeSettings()">关闭</button>
</div>

<div id="jumpscare"><canvas id="jumpscareCanvas" width="800" height="600"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== GAME STATE =====
const Game = {
  state: 'menu',
  currentLevel: 0,
  scene: null, camera: null, renderer: null,
  player: {
    health: 100, maxHealth: 100,
    san: 100, maxSan: 100,
    position: new THREE.Vector3(0, 1.7, 0),
    velocity: new THREE.Vector3(),
    onGround: true, isCrouching: false, isSprinting: false,
    level: 1, exp: 0, expToNext: 100, skillPoints: 0, coins: 0,
    weapons: ['p92'], equippedWeapon: 'p92',
    inventory: [], stamina: 100
  },
  monsters: [], items: [], walls: [], lights: [],
  extractPoints: [], lootBoxes: [], particles: [],
  keys: {}, mouse: {dx:0, dy:0, leftDown:false, rightDown:false},
  isPointerLocked: false, isADS: false,
  sensitivity: 0.002,
  extractActive: false, extractTimer: 0, extractPosition: null,
  killCount: 0, lootValue: 0,
  mapData: null, chaseTimer: 0
};
</script>

<script>
// ===== PART 1: ENGINE CORE & MAP SYSTEM =====

// ---------- CONFIG ----------
const CONFIG = {
  fov: 75, near: 0.1, far: 100, fogDensity: 0.045,
  playerHeight: 1.7, playerRadius: 0.35, walkSpeed: 5, sprintSpeed: 8, crouchSpeed: 2.5,
  jumpForce: 6, gravity: 20, mouseSensitivity: 0.002,
  levels: [
    { name: "The Lobby", desc: "黄色壁纸的房间永无止境。荧光灯嗡嗡作响，空气中弥漫着潮味。", wallColor: 0xc4a847, floorColor: 0x8a7a2e, ceilColor: 0xc4a847, fogColor: 0x2a2410, ambientIntensity: 0.35, lightColor: 0xfff4d0, monsterTypes: ['hound','smiler'], roomCount: 15 },
    { name: "Habitable Zone", desc: "混凝土仓库。冷光灯下，每个角落都可能藏着东西。", wallColor: 0x888888, floorColor: 0x555555, ceilColor: 0x666666, fogColor: 0x1a1a1a, ambientIntensity: 0.28, lightColor: 0xffffff, monsterTypes: ['stalker','hound'], roomCount: 18 },
    { name: "Pipe Dreams", desc: "管道隧道错综复杂，应急灯勉强照亮前方几米。", wallColor: 0x6b3a1a, floorColor: 0x3a2010, ceilColor: 0x4a2818, fogColor: 0x1a0a05, ambientIntensity: 0.18, lightColor: 0xff6644, monsterTypes: ['skinstealer','stalker'], roomCount: 22 },
    { name: "Electrical Station", desc: "电气机房。火花四溅，不自然的笑声在远处回荡。", wallColor: 0x2a4a6a, floorColor: 0x1a2a3a, ceilColor: 0x223348, fogColor: 0x05101a, ambientIntensity: 0.22, lightColor: 0x44aaff, monsterTypes: ['partygoer','skinstealer'], roomCount: 20 },
    { name: "Run For Your Life", desc: "跑。不要回头。不要停下。", wallColor: 0x4a0000, floorColor: 0x2a0000, ceilColor: 0x3a0000, fogColor: 0x1a0000, ambientIntensity: 0.12, lightColor: 0xff0000, monsterTypes: ['hound','stalker','smiler','skinstealer','partygoer'], roomCount: 1, isChase: true }
  ]
};

// ---------- TEXTURE FACTORY ----------
const TextureFactory = {
  _canvas: null,
  _ctx: null,
  _getCanvas(size) {
    if (!this._canvas) { this._canvas = document.createElement('canvas'); }
    this._canvas.width = size; this._canvas.height = size;
    if (!this._ctx) this._ctx = this._canvas.getContext('2d');
    return this._canvas;
  },
  _toTexture() {
    const tex = new THREE.CanvasTexture(this._canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  },
  wallTexture(baseColor) {
    const c = this._getCanvas(256); const ctx = this._ctx;
    const hex = '#' + baseColor.toString(16).padStart(6, '0');
    ctx.fillStyle = hex; ctx.fillRect(0, 0, 256, 256);
    // noise
    for (let i = 0; i < 2000; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      const v = (Math.random() - 0.5) * 40;
      const r = parseInt(hex.substr(1,2),16)+v, g = parseInt(hex.substr(3,2),16)+v, b = parseInt(hex.substr(5,2),16)+v;
      ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`;
      ctx.fillRect(x, y, 2, 2);
    }
    // stains
    for (let i = 0; i < 8; i++) {
      const x = Math.random()*256, y = Math.random()*256, r = 10+Math.random()*30;
      const grad = ctx.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0, 'rgba(40,30,10,0.4)');
      grad.addColorStop(1, 'rgba(40,30,10,0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    // wallpaper pattern lines
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    for (let y = 0; y < 256; y += 32) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(256,y); ctx.stroke(); }
    const tex = this._toTexture(); tex.repeat.set(2, 1); return tex;
  },
  floorTexture(baseColor) {
    const c = this._getCanvas(256); const ctx = this._ctx;
    const hex = '#' + baseColor.toString(16).padStart(6, '0');
    ctx.fillStyle = hex; ctx.fillRect(0,0,256,256);
    for (let i = 0; i < 1500; i++) {
      const x = Math.random()*256, y = Math.random()*256, v = (Math.random()-0.5)*30;
      const r = parseInt(hex.substr(1,2),16)+v, g = parseInt(hex.substr(3,2),16)+v, b = parseInt(hex.substr(5,2),16)+v;
      ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`;
      ctx.fillRect(x,y,2,2);
    }
    // grid tiles
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    for (let i = 0; i <= 256; i += 64) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,256); ctx.moveTo(0,i); ctx.lineTo(256,i); ctx.stroke(); }
    const tex = this._toTexture(); tex.repeat.set(3,3); return tex;
  },
  ceilingTexture(baseColor) {
    const c = this._getCanvas(256); const ctx = this._ctx;
    const hex = '#' + baseColor.toString(16).padStart(6, '0');
    ctx.fillStyle = hex; ctx.fillRect(0,0,256,256);
    for (let i = 0; i < 1000; i++) {
      const x = Math.random()*256, y = Math.random()*256, v = (Math.random()-0.5)*20;
      const r = parseInt(hex.substr(1,2),16)+v, g = parseInt(hex.substr(3,2),16)+v, b = parseInt(hex.substr(5,2),16)+v;
      ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`;
      ctx.fillRect(x,y,2,2);
    }
    // ceiling panels
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    for (let i = 0; i <= 256; i += 128) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,256); ctx.moveTo(0,i); ctx.lineTo(256,i); ctx.stroke(); }
    const tex = this._toTexture(); tex.repeat.set(2,2); return tex;
  },
  metalTexture() {
    const c = this._getCanvas(128); const ctx = this._ctx;
    ctx.fillStyle = '#555'; ctx.fillRect(0,0,128,128);
    for (let i = 0; i < 500; i++) { const x=Math.random()*128,y=Math.random()*128,v=(Math.random()-0.5)*40; ctx.fillStyle=`rgb(${85+v},${85+v},${85+v})`; ctx.fillRect(x,y,2,2); }
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.strokeRect(2,2,124,124);
    return this._toTexture();
  },
  doorTexture() {
    const c = this._getCanvas(128); const ctx = this._ctx;
    ctx.fillStyle='#3a2810'; ctx.fillRect(0,0,128,128);
    ctx.fillStyle='#5a3820'; ctx.fillRect(8,8,112,112);
    ctx.strokeStyle='#2a1808'; ctx.lineWidth=2; ctx.strokeRect(8,8,112,112);
    ctx.fillStyle='#8a6030'; ctx.fillRect(56,64,16,16); // handle
    return this._toTexture();
  },
  crateTexture() {
    const c = this._getCanvas(128); const ctx = this._ctx;
    ctx.fillStyle='#6a4a20'; ctx.fillRect(0,0,128,128);
    ctx.strokeStyle='#4a3010'; ctx.lineWidth=3;
    ctx.strokeRect(4,4,120,120); ctx.beginPath();
    ctx.moveTo(4,4); ctx.lineTo(124,124); ctx.moveTo(124,4); ctx.lineTo(4,124); ctx.stroke();
    for (let i=0;i<200;i++){ctx.fillStyle=`rgba(${80+Math.random()*30},${60+Math.random()*20},${20+Math.random()*10},0.5)`;ctx.fillRect(Math.random()*128,Math.random()*128,2,2);}
    return this._toTexture();
  },
  bloodTexture() {
    const c = this._getCanvas(128); const ctx = this._ctx;
    ctx.clearRect(0,0,128,128);
    for (let i=0;i<15;i++){const x=Math.random()*128,y=Math.random()*128,r=5+Math.random()*20;const grad=ctx.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,'rgba(120,0,0,0.7)');grad.addColorStop(1,'rgba(80,0,0,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
    return this._toTexture();
  },
  monsterFaceTexture() {
    const c = this._getCanvas(256); const ctx = this._ctx;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,256,256);
    // face
    ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.ellipse(128,128,90,110,0,0,Math.PI*2); ctx.fill();
    // eyes
    ctx.fillStyle='#ff0000'; ctx.beginPath(); ctx.ellipse(95,100,18,12,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(161,100,18,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff6666'; ctx.beginPath(); ctx.ellipse(95,100,8,6,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(161,100,8,6,0,0,Math.PI*2); ctx.fill();
    // mouth
    ctx.fillStyle='#660000'; ctx.beginPath(); ctx.ellipse(128,175,40,25,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff3333'; for(let i=0;i<6;i++){ctx.fillRect(108+i*8,155,4,20);}
    return this._toTexture();
  }
};

// ---------- AUDIO SYSTEM ----------
const AudioSystem = {
  ctx: null, masterGain: null, ambientNode: null, volume: 0.5,
  init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.volume;
      this.masterGain.connect(this.ctx.destination);
    } catch(e) { console.warn('Audio init failed', e); }
  },
  setVolume(v) { this.volume = v; if (this.masterGain) this.masterGain.gain.value = v; },
  _now() { return this.ctx ? this.ctx.currentTime : 0; },
  _tone(freq, dur, type, vol, slideTo) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = type || 'square'; osc.frequency.value = freq;
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, this._now()+dur);
    gain.gain.setValueAtTime(vol||0.3, this._now());
    gain.gain.exponentialRampToValueAtTime(0.001, this._now()+dur);
    osc.connect(gain); gain.connect(this.masterGain);
    osc.start(); osc.stop(this._now()+dur);
  },
  _noise(dur, vol, filterFreq) {
    if (!this.ctx) return;
    const bufSize = this.ctx.sampleRate * dur;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random()*2-1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol||0.2, this._now());
    gain.gain.exponentialRampToValueAtTime(0.001, this._now()+dur);
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = filterFreq || 2000;
    src.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
    src.start(); src.stop(this._now()+dur);
  },
  playGunshot(type) {
    if (!this.ctx) return;
    const freqMap = { ar: 150, smg: 200, sg: 80, sr: 100, pg: 250 };
    this._noise(0.08, 0.4, 3000);
    this._tone(freqMap[type]||150, 0.05, 'square', 0.3, 50);
  },
  playReload() { this._tone(400,0.05,'sine',0.2); setTimeout(()=>this._tone(300,0.05,'sine',0.2),100); setTimeout(()=>this._tone(500,0.08,'sine',0.2),250); },
  playMonsterGrowl(type) {
    const f = { hound: 80, stalker: 50, smiler: 200, skinstealer: 60, partygoer: 120 }[type] || 80;
    this._tone(f, 0.5, 'sawtooth', 0.15, f*0.5);
  },
  playFootstep() { this._noise(0.03, 0.08, 500); },
  playHurt() { this._tone(200, 0.15, 'sawtooth', 0.3, 80); },
  playPickup() { this._tone(600,0.06,'sine',0.2); setTimeout(()=>this._tone(800,0.06,'sine',0.2),80); },
  playLevelUp() { this._tone(500,0.1,'sine',0.3); setTimeout(()=>this._tone(700,0.1,'sine',0.3),100); setTimeout(()=>this._tone(900,0.15,'sine',0.3),200); },
  playExtractAlarm() {
    this._tone(800,0.2,'square',0.2);
    setTimeout(()=>this._tone(600,0.2,'square',0.2),250);
    setTimeout(()=>this._tone(800,0.2,'square',0.2),500);
  },
  playAmbient(level) {
    if (this.ambientNode) { try { this.ambientNode.stop(); } catch(e){} }
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = 40 + level * 5;
    gain.gain.value = 0.03;
    osc.connect(gain); gain.connect(this.masterGain);
    osc.start();
    this.ambientNode = osc;
  },
  playJumpScare() {
    this._noise(0.3, 0.6, 5000);
    this._tone(1000, 0.2, 'sawtooth', 0.4, 200);
  },
  stopAmbient() { if (this.ambientNode) { try { this.ambientNode.stop(); } catch(e){} this.ambientNode = null; } }
};

// ---------- MAP GENERATOR ----------
const MapGenerator = {
  generate(levelIndex) {
    const cfg = CONFIG.levels[levelIndex];
    if (cfg.isChase) return this._generateChase(levelIndex);
    return this._generateNormal(levelIndex, cfg);
  },
  _generateNormal(levelIndex, cfg) {
    const rooms = [], corridors = [], walls = [], lights = [];
    const lootBoxes = [], extractPoints = [], specialRooms = [];
    const hiddenDoors = [];
    let safeHouse = null, spawnPoint = null;

    const gridSize = Math.ceil(Math.sqrt(cfg.roomCount * 1.5));
    const cellSize = 10;
    const grid = [];
    for (let i = 0; i < gridSize; i++) { grid[i] = []; for (let j = 0; j < gridSize; j++) grid[i][j] = null; }

    // Place rooms
    const roomCount = Math.min(cfg.roomCount, gridSize * gridSize);
    let placed = 0;
    const roomPositions = [];
    while (placed < roomCount) {
      const gx = Math.floor(Math.random() * gridSize);
      const gy = Math.floor(Math.random() * gridSize);
      if (grid[gx][gy] === null) {
        const w = 6 + Math.floor(Math.random() * 4) * 2; // 6,8,10,12
        const d = 6 + Math.floor(Math.random() * 4) * 2;
        const room = {
          id: placed, gx, gy, x: gx * cellSize, z: gy * cellSize,
          width: w, depth: d, height: 3,
          type: 'normal', connected: false
        };
        grid[gx][gy] = room;
        rooms.push(room);
        roomPositions.push({gx, gy});
        placed++;
      }
    }

    // Connect rooms (MST-like)
    rooms[0].connected = true;
    const connected = [rooms[0]];
    while (connected.length < rooms.length) {
      let bestPair = null, bestDist = Infinity;
      for (let a of connected) {
        for (let b of rooms) {
          if (b.connected) continue;
          const dx = a.gx - b.gx, dy = a.gy - b.gy;
          const dist = Math.abs(dx) + Math.abs(dy);
          if (dist < bestDist) { bestDist = dist; bestPair = {a, b}; }
        }
      }
      if (!bestPair) break;
      bestPair.b.connected = true;
      connected.push(bestPair.b);
      // Create corridor
      const corridor = this._makeCorridor(bestPair.a, bestPair.b, cellSize);
      corridors.push(corridor);
    }

    // Assign special rooms
    const shuffled = [...rooms].sort(() => Math.random() - 0.5);
    // Spawn point
    spawnPoint = new THREE.Vector3(shuffled[0].x, CONFIG.playerHeight, shuffled[0].z);
    shuffled[0].type = 'spawn';
    // Safe house
    if (shuffled[1]) { shuffled[1].type = 'safe'; safeHouse = new THREE.Vector3(shuffled[1].x, 0, shuffled[1].z); }
    // Extract points (2-3)
    const numExtract = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < numExtract && i + 2 < shuffled.length; i++) {
      shuffled[i + 2].type = 'extract';
      extractPoints.push({
        position: new THREE.Vector3(shuffled[i+2].x, 0, shuffled[i+2].z),
        activated: false, room: shuffled[i+2]
      });
    }
    // Treasure rooms (1-2)
    const numTreasure = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < numTreasure && i + 2 + numExtract < shuffled.length; i++) {
      const idx = i + 2 + numExtract;
      shuffled[idx].type = 'treasure';
      specialRooms.push({ room: shuffled[idx], type: 'treasure' });
      lootBoxes.push({
        position: new THREE.Vector3(shuffled[idx].x, 0, shuffled[idx].z),
        opened: false, rarity: 'rare', mesh: null
      });
    }
    // Hidden room
    if (Math.random() < 0.5 && shuffled.length > numTreasure + numExtract + 2) {
      const idx = numTreasure + numExtract + 2;
      shuffled[idx].type = 'hidden';
      hiddenDoors.push({
        position: new THREE.Vector3(shuffled[idx].x, 0, shuffled[idx].z),
        opened: false, mesh: null
      });
      lootBoxes.push({
        position: new THREE.Vector3(shuffled[idx].x + 1, 0, shuffled[idx].z + 1),
        opened: false, rarity: 'epic', mesh: null
      });
    }

    // Generate walls for each room
    for (let room of rooms) {
      this._addRoomWalls(room, walls);
      // Room light
      const flicker = Math.random() < 0.3;
      lights.push({
        position: new THREE.Vector3(room.x, 2.7, room.z),
        color: cfg.lightColor, intensity: 0.8, flicker, flickerTimer: Math.random() * 5,
        room: room
      });
    }

    // Generate walls for corridors
    for (let corr of corridors) {
      this._addCorridorWalls(corr, walls);
    }

    // Place loot boxes in normal rooms
    for (let room of rooms) {
      if (room.type === 'normal' && Math.random() < 0.4) {
        const lx = room.x + (Math.random() - 0.5) * (room.width - 2);
        const lz = room.z + (Math.random() - 0.5) * (room.depth - 2);
        lootBoxes.push({
          position: new THREE.Vector3(lx, 0, lz),
          opened: false, rarity: Math.random() < 0.15 ? 'rare' : 'common', mesh: null
        });
      }
    }

    // Place scattered items
    const items = [];
    for (let room of rooms) {
      if (room.type === 'normal' && Math.random() < 0.3) {
        const ix = room.x + (Math.random() - 0.5) * (room.width - 2);
        const iz = room.z + (Math.random() - 0.5) * (room.depth - 2);
        const itemTypes = ['ammo', 'coin', 'syringe', 'molotov'];
        const kind = itemTypes[Math.floor(Math.random() * itemTypes.length)];
        items.push({
          position: new THREE.Vector3(ix, 0.5, iz),
          kind, pickedUp: false, mesh: null,
          amount: kind === 'ammo' ? 10 + Math.floor(Math.random() * 20) : kind === 'coin' ? 10 + Math.floor(Math.random() * 30) : 1,
          name: kind
        });
      }
    }

    return { rooms, corridors, walls, lights, lootBoxes, extractPoints, items, spawnPoint, safeHouse, specialRooms, hiddenDoors };
  },
  _makeCorridor(a, b, cellSize) {
    const ax = a.x, az = a.z, bx = b.x, bz = b.z;
    const midX = (ax + bx) / 2, midZ = (az + bz) / 2;
    // L-shaped corridor
    const segments = [];
    if (Math.abs(ax - bx) > 1) {
      segments.push({ x1: ax, z1: az, x2: midX, z2: az, w: 2.5 });
      segments.push({ x1: midX, z1: az, x2: midX, z2: bz, w: 2.5 });
    } else {
      segments.push({ x1: ax, z1: az, x2: ax, z2: midZ, w: 2.5 });
      segments.push({ x1: ax, z1: midZ, x2: bx, z2: midZ, w: 2.5 });
    }
    return { segments, a, b };
  },
  _addRoomWalls(room, walls) {
    const hw = room.width / 2, hd = room.depth / 2;
    // 4 walls with door gaps
    const doorWidth = 2.5;
    // North wall (z - hd)
    walls.push({ x: room.x, z: room.z - hd, width: room.width, depth: 0.3, type: 'wall' });
    // South wall
    walls.push({ x: room.x, z: room.z + hd, width: room.width, depth: 0.3, type: 'wall' });
    // East wall
    walls.push({ x: room.x + hw, z: room.z, width: 0.3, depth: room.depth, type: 'wall' });
    // West wall
    walls.push({ x: room.x - hw, z: room.z, width: 0.3, depth: room.depth, type: 'wall' });
    // Internal collision boxes for AABB
    walls.push({ x: room.x - hw, z: room.z, width: 0.3, depth: room.depth, isCollision: true });
    walls.push({ x: room.x + hw, z: room.z, width: 0.3, depth: room.depth, isCollision: true });
    walls.push({ x: room.x, z: room.z - hd, width: room.width, depth: 0.3, isCollision: true });
    walls.push({ x: room.x, z: room.z + hd, width: room.width, depth: 0.3, isCollision: true });
  },
  _addCorridorWalls(corr, walls) {
    for (let seg of corr.segments) {
      const cx = (seg.x1 + seg.x2) / 2, cz = (seg.z1 + seg.z2) / 2;
      const dx = Math.abs(seg.x2 - seg.x1), dz = Math.abs(seg.z2 - seg.z1);
      if (dx > dz) {
        // Horizontal corridor
        walls.push({ x: cx, z: cz - seg.w/2, width: dx + 1, depth: 0.3, isCollision: true });
        walls.push({ x: cx, z: cz + seg.w/2, width: dx + 1, depth: 0.3, isCollision: true });
      } else {
        // Vertical corridor
        walls.push({ x: cx - seg.w/2, z: cz, width: 0.3, depth: dz + 1, isCollision: true });
        walls.push({ x: cx + seg.w/2, z: cz, width: 0.3, depth: dz + 1, isCollision: true });
      }
    }
  },
  _generateChase(levelIndex) {
    const walls = [], lights = [], lootBoxes = [], extractPoints = [], items = [];
    const corridorLen = 120, corridorWidth = 4;
    // Long straight corridor
    for (let z = 0; z < corridorLen; z += 10) {
      walls.push({ x: -corridorWidth/2, z, width: 0.3, depth: 10, isCollision: true });
      walls.push({ x: corridorWidth/2, z, width: 0.3, depth: 10, isCollision: true });
      lights.push({
        position: new THREE.Vector3(0, 2.7, z),
        color: 0xff0000, intensity: 0.5, flicker: true, flickerTimer: 0
      });
    }
    // Obstacles
    for (let i = 0; i < 8; i++) {
      const z = 15 + i * 12 + Math.random() * 5;
      walls.push({ x: (Math.random() - 0.5) * 2, z, width: 1, depth: 1, isCollision: true });
    }
    const spawnPoint = new THREE.Vector3(0, CONFIG.playerHeight, 0);
    const exitPoint = new THREE.Vector3(0, 0, corridorLen - 5);
    extractPoints.push({ position: exitPoint, activated: true });
    return { rooms: [], corridors: [], walls, lights, lootBoxes, extractPoints, items, spawnPoint, safeHouse: null, specialRooms: [], hiddenDoors: [], exitPoint, isChase: true };
  }
};

// ---------- SCENE BUILDER ----------
const SceneBuilder = {
  _geometries: {}, _materials: {},
  buildScene(mapData, levelIndex) {
    const cfg = CONFIG.levels[levelIndex];
    // Fog
    Game.scene.fog = new THREE.FogExp2(cfg.fogColor, CONFIG.fogDensity);
    Game.scene.background = new THREE.Color(cfg.fogColor);
    // Ambient light
    const ambient = new THREE.AmbientLight(cfg.lightColor, cfg.ambientIntensity);
    Game.scene.add(ambient);

    // Shared materials
    const wallTex = TextureFactory.wallTexture(cfg.wallColor);
    const floorTex = TextureFactory.floorTexture(cfg.floorColor);
    const ceilTex = TextureFactory.ceilingTexture(cfg.ceilColor);
    const matWall = new THREE.MeshLambertMaterial({ map: wallTex });
    const matFloor = new THREE.MeshLambertMaterial({ map: floorTex });
    const matCeil = new THREE.MeshLambertMaterial({ map: ceilTex });

    // Build rooms
    if (mapData.rooms && mapData.rooms.length > 0) {
      for (let room of mapData.rooms) {
        this._buildRoom(room, matWall, matFloor, matCeil, cfg);
      }
    }
    // Build corridors
    if (mapData.corridors) {
      for (let corr of mapData.corridors) {
        this._buildCorridor(corr, matWall, matFloor, matCeil, cfg);
      }
    }
    // Build lights
    for (let lt of mapData.lights) {
      const light = new THREE.PointLight(lt.color, lt.intensity, 15, 2);
      light.position.copy(lt.position);
      Game.scene.add(light);
      Game.lights.push({ light, data: lt });
      // Light fixture
      const fixtureGeo = new THREE.BoxGeometry(0.5, 0.1, 0.5);
      const fixtureMat = new THREE.MeshBasicMaterial({ color: lt.color });
      const fixture = new THREE.Mesh(fixtureGeo, fixtureMat);
      fixture.position.copy(lt.position);
      fixture.position.y += 0.2;
      Game.scene.add(fixture);
    }
    // Build loot boxes
    for (let lb of mapData.lootBoxes) {
      const geo = new THREE.BoxGeometry(0.8, 0.6, 0.8);
      const mat = new THREE.MeshLambertMaterial({ map: TextureFactory.crateTexture() });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(lb.position);
      mesh.position.y = 0.3;
      Game.scene.add(mesh);
      lb.mesh = mesh;
      // Glow for rare/epic
      if (lb.rarity !== 'common') {
        const glowColor = lb.rarity === 'epic' ? 0xff00ff : 0x00ffff;
        const glow = new THREE.PointLight(glowColor, 0.5, 5);
        glow.position.copy(lb.position); glow.position.y = 0.5;
        Game.scene.add(glow);
      }
    }
    // Build extract points
    for (let ep of mapData.extractPoints) {
      // Red door
      const doorGeo = new THREE.BoxGeometry(1.5, 2.5, 0.2);
      const doorMat = new THREE.MeshLambertMaterial({ color: 0xff0000, emissive: 0x440000 });
      const door = new THREE.Mesh(doorGeo, doorMat);
      door.position.copy(ep.position); door.position.y = 1.25;
      Game.scene.add(door);
      // Beacon
      const beacon = new THREE.PointLight(0xff0000, 1, 10);
      beacon.position.copy(ep.position); beacon.position.y = 2;
      Game.scene.add(beacon);
      Game.lights.push({ light: beacon, data: { flicker: true, flickerTimer: 0, color: 0xff0000, intensity: 1 } });
    }
    // Build safe house marker
    if (mapData.safeHouse) {
      const markerGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.1, 16);
      const markerMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.3 });
      const marker = new THREE.Mesh(markerGeo, markerMat);
      marker.position.copy(mapData.safeHouse); marker.position.y = 0.05;
      Game.scene.add(marker);
      const healLight = new THREE.PointLight(0x00ff00, 0.5, 8);
      healLight.position.copy(mapData.safeHouse); healLight.position.y = 2;
      Game.scene.add(healLight);
    }
    // Build hidden doors
    if (mapData.hiddenDoors) {
      for (let hd of mapData.hiddenDoors) {
        const geo = new THREE.BoxGeometry(1.2, 2.2, 0.15);
        const mat = new THREE.MeshLambertMaterial({ color: 0x333322 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(hd.position); mesh.position.y = 1.1;
        Game.scene.add(mesh);
        hd.mesh = mesh;
      }
    }
    // Build items on ground
    for (let item of mapData.items) {
      this._buildItem(item);
    }
    // Build props (tables, pipes etc.)
    if (mapData.rooms) {
      for (let room of mapData.rooms) {
        if (room.type === 'normal' && Math.random() < 0.4) {
          this._buildProp(room);
        }
      }
    }
    // Chase level special
    if (mapData.isChase) {
      // Floor
      const floorGeo = new THREE.PlaneGeometry(4, 120);
      const floorMat = new THREE.MeshLambertMaterial({ color: 0x2a0000 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 60);
      Game.scene.add(floor);
      // Ceiling
      const ceil = new THREE.Mesh(floorGeo, matCeil);
      ceil.rotation.x = Math.PI / 2; ceil.position.set(0, 3, 60);
      Game.scene.add(ceil);
      // Walls
      const wallGeoL = new THREE.PlaneGeometry(120, 3);
      const wallMatR = new THREE.MeshLambertMaterial({ color: 0x4a0000 });
      const wL = new THREE.Mesh(wallGeoL, wallMatR); wL.position.set(-2, 1.5, 60); wL.rotation.y = Math.PI/2; Game.scene.add(wL);
      const wR = new THREE.Mesh(wallGeoL, wallMatR); wR.position.set(2, 1.5, 60); wR.rotation.y = -Math.PI/2; Game.scene.add(wR);
    }
  },
  _buildRoom(room, matWall, matFloor, matCeil, cfg) {
    const hw = room.width / 2, hd = room.depth / 2;
    // Floor
    const floorGeo = new THREE.PlaneGeometry(room.width, room.depth);
    const floor = new THREE.Mesh(floorGeo, matFloor);
    floor.rotation.x = -Math.PI / 2; floor.position.set(room.x, 0, room.z);
    Game.scene.add(floor);
    // Ceiling
    const ceil = new THREE.Mesh(floorGeo, matCeil);
    ceil.rotation.x = Math.PI / 2; ceil.position.set(room.x, 3, room.z);
    Game.scene.add(ceil);
    // Walls (visual only, collision is separate)
    const wallNGeo = new THREE.PlaneGeometry(room.width, 3);
    const wallN = new THREE.Mesh(wallNGeo, matWall); wallN.position.set(room.x, 1.5, room.z - hd); Game.scene.add(wallN);
    const wallS = new THREE.Mesh(wallNGeo, matWall); wallS.position.set(room.x, 1.5, room.z + hd); wallS.rotation.y = Math.PI; Game.scene.add(wallS);
    const wallEGeo = new THREE.PlaneGeometry(room.depth, 3);
    const wallE = new THREE.Mesh(wallEGeo, matWall); wallE.position.set(room.x + hw, 1.5, room.z); wallE.rotation.y = -Math.PI/2; Game.scene.add(wallE);
    const wallW = new THREE.Mesh(wallEGeo, matWall); wallW.position.set(room.x - hw, 1.5, room.z); wallW.rotation.y = Math.PI/2; Game.scene.add(wallW);
    // Special room coloring
    if (room.type === 'safe') {
      const ringGeo = new THREE.RingGeometry(1, 1.4, 16);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2; ring.position.set(room.x, 0.02, room.z);
      Game.scene.add(ring);
    } else if (room.type === 'treasure') {
      const glow = new THREE.PointLight(0x00ffff, 0.4, 8);
      glow.position.set(room.x, 2, room.z); Game.scene.add(glow);
    } else if (room.type === 'spawn') {
      const ringGeo = new THREE.RingGeometry(0.8, 1.2, 16);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2; ring.position.set(room.x, 0.02, room.z);
      Game.scene.add(ring);
    }
  },
  _buildCorridor(corr, matWall, matFloor, matCeil, cfg) {
    for (let seg of corr.segments) {
      const cx = (seg.x1 + seg.x2) / 2, cz = (seg.z1 + seg.z2) / 2;
      const dx = Math.max(Math.abs(seg.x2 - seg.x1), 1), dz = Math.max(Math.abs(seg.z2 - seg.z1), 1);
      const w = seg.w || 2.5;
      const floorW = dx > dz ? dx + 1 : w;
      const floorD = dx > dz ? w : dz + 1;
      const floorGeo = new THREE.PlaneGeometry(floorW, floorD);
      const floor = new THREE.Mesh(floorGeo, matFloor);
      floor.rotation.x = -Math.PI / 2; floor.position.set(cx, 0, cz);
      Game.scene.add(floor);
      const ceil = new THREE.Mesh(floorGeo, matCeil);
      ceil.rotation.x = Math.PI / 2; ceil.position.set(cx, 3, cz);
      Game.scene.add(ceil);
    }
  },
  _buildItem(item) {
    let geo, mat;
    if (item.kind === 'ammo') {
      geo = new THREE.BoxGeometry(0.3, 0.2, 0.3); mat = new THREE.MeshLambertMaterial({ color: 0x8a7a2e });
    } else if (item.kind === 'coin') {
      geo = new THREE.CylinderGeometry(0.15, 0.15, 0.05, 8); mat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
    } else if (item.kind === 'syringe') {
      geo = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 6); mat = new THREE.MeshLambertMaterial({ color: 0x00ffff });
    } else {
      geo = new THREE.BoxGeometry(0.2, 0.3, 0.2); mat = new THREE.MeshLambertMaterial({ color: 0x8a4040 });
    }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(item.position);
    mesh.userData.item = item;
    Game.scene.add(mesh);
    item.mesh = mesh;
  },
  _buildProp(room) {
    const types = ['table', 'shelf', 'pipe', 'barrel'];
    const type = types[Math.floor(Math.random() * types.length)];
    const px = room.x + (Math.random() - 0.5) * (room.width - 3);
    const pz = room.z + (Math.random() - 0.5) * (room.depth - 3);
    if (type === 'table') {
      const top = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 0.8), new THREE.MeshLambertMaterial({ color: 0x5a3a20 }));
      top.position.set(px, 0.8, pz); Game.scene.add(top);
      for (let i = 0; i < 4; i++) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), new THREE.MeshLambertMaterial({ color: 0x4a2a10 }));
        leg.position.set(px + (i < 2 ? -0.65 : 0.65), 0.4, pz + (i % 2 ? -0.3 : 0.3)); Game.scene.add(leg);
      }
    } else if (type === 'shelf') {
      const shelf = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.4), new THREE.MeshLambertMaterial({ color: 0x4a4a4a }));
      shelf.position.set(px, 1, pz); Game.scene.add(shelf);
    } else if (type === 'pipe') {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3, 8), new THREE.MeshLambertMaterial({ color: 0x665544 }));
      pipe.rotation.z = Math.PI / 2; pipe.position.set(px, 2.5, pz); Game.scene.add(pipe);
    } else {
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1, 12), new THREE.MeshLambertMaterial({ color: 0x4a2a2a }));
      barrel.position.set(px, 0.5, pz); Game.scene.add(barrel);
    }
  }
};

// ---------- PLAYER CONTROLLER ----------
const PlayerController = {
  yaw: 0, pitch: 0, bobPhase: 0, breathPhase: 0, footstepTimer: 0, hurtFlash: 0,
  handleMouseMove(dx, dy) {
    this.yaw -= dx * Game.sensitivity;
    this.pitch -= dy * Game.sensitivity;
    this.pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, this.pitch));
    Game.camera.rotation.order = 'YXZ';
    Game.camera.rotation.y = this.yaw;
    Game.camera.rotation.x = this.pitch;
  },
  update(delta) {
    const p = Game.player;
    // Movement input
    let mx = 0, mz = 0;
    if (Game.keys['KeyW']) mz -= 1;
    if (Game.keys['KeyS']) mz += 1;
    if (Game.keys['KeyA']) mx -= 1;
    if (Game.keys['KeyD']) mx += 1;
    // Normalize
    if (mx !== 0 && mz !== 0) { mx *= 0.707; mz *= 0.707; }
    // Speed
    let speed = CONFIG.walkSpeed;
    if (Game.keys['ShiftLeft'] && !p.isCrouching && p.stamina > 0) { speed = CONFIG.sprintSpeed; p.isSprinting = true; p.stamina -= delta * 20; }
    else { p.isSprinting = false; p.stamina = Math.min(100, p.stamina + delta * 15); }
    if (Game.keys['ControlLeft'] || Game.keys['KeyC']) { speed = CONFIG.crouchSpeed; p.isCrouching = true; }
    else p.isCrouching = false;
    // ADS slows down
    if (Game.isADS) speed *= 0.5;
    // Calculate movement vector (relative to yaw)
    const cosY = Math.cos(this.yaw), sinY = Math.sin(this.yaw);
    const vx = (mx * cosY - mz * sinY) * speed;
    const vz = (mx * sinY + mz * cosY) * speed;
    p.velocity.x = vx; p.velocity.z = vz;
    // Gravity & jump
    if (Game.keys['Space'] && p.onGround) { p.velocity.y = CONFIG.jumpForce; p.onGround = false; }
    p.velocity.y -= CONFIG.gravity * delta;
    // Move and collide
    let newX = p.position.x + p.velocity.x * delta;
    let newZ = p.position.z + p.velocity.z * delta;
    // Collision X
    if (this._checkCollision(newX, p.position.z, CONFIG.playerRadius)) { newX = p.position.x; }
    // Collision Z
    if (this._checkCollision(newX, newZ, CONFIG.playerRadius)) { newZ = p.position.z; }
    p.position.x = newX; p.position.z = newZ;
    // Vertical
    p.position.y += p.velocity.y * delta;
    let floorY = CONFIG.playerHeight;
    if (p.isCrouching) floorY = CONFIG.playerHeight * 0.6;
    if (p.position.y <= floorY) { p.position.y = floorY; p.velocity.y = 0; p.onGround = true; }
    // Head bob
    if ((mx !== 0 || mz !== 0) && p.onGround) {
      this.bobPhase += delta * (p.isSprinting ? 12 : 8);
      const bob = Math.sin(this.bobPhase) * 0.04;
      Game.camera.position.y = p.position.y + bob;
      this.footstepTimer += delta;
      if (this.footstepTimer > (p.isSprinting ? 0.3 : 0.5)) { AudioSystem.playFootstep(); this.footstepTimer = 0; }
    } else {
      // Breathing
      this.breathPhase += delta * 1.5;
      Game.camera.position.y = p.position.y + Math.sin(this.breathPhase) * 0.01;
    }
    Game.camera.position.x = p.position.x; Game.camera.position.z = p.position.z;
    // Hurt flash
    if (this.hurtFlash > 0) {
      this.hurtFlash -= delta * 3;
      const v = document.getElementById('damageVignette');
      if (v) v.style.boxShadow = `inset 0 0 ${100 + this.hurtFlash*50}px rgba(255,0,0,${this.hurtFlash * 0.5})`;
    }
  },
  _checkCollision(x, z, radius) {
    if (!Game.walls) return false;
    for (let w of Game.walls) {
      if (!w.isCollision) continue;
      const dx = Math.abs(x - w.x) - w.width/2 - radius;
      const dz = Math.abs(z - w.z) - w.depth/2 - radius;
      if (dx < 0 && dz < 0) return true;
    }
    return false;
  },
  takeDamage(amount) {
    Game.player.health -= amount;
    this.hurtFlash = 1;
    AudioSystem.playHurt();
    // Damage direction indicator
    uiSystem.showDamageIndicator(0);
    if (Game.player.health <= 0) { Game.player.health = 0; }
  },
  heal(amount) { Game.player.health = Math.min(Game.player.maxHealth, Game.player.health + amount); },
  addSan(amount) { Game.player.san = Math.min(Game.player.maxSan, Game.player.san + amount); },
  reduceSan(amount) { Game.player.san = Math.max(0, Game.player.san - amount); },
  die() { playerDeath(); }
};

</script>
<script>
// ===== PART 2: WEAPONS & MONSTERS =====

// ---------- WEAPONS ----------
const WEAPONS = {
  knife: { id:'knife', name:'小刀', type:'melee', damage:30, fireRate:120, magazine:0, reserveAmmo:0, range:2.5, recoilVertical:0, recoilHorizontal:0, spread:0, auto:false, adsZoom:1, pellets:1, reloadTime:0, price:0, unlocked:true },
  p92: { id:'p92', name:'P92', type:'pg', damage:18, fireRate:400, magazine:15, reserveAmmo:30, range:50, recoilVertical:1.5, recoilHorizontal:0.5, spread:2, auto:false, adsZoom:1.3, pellets:1, reloadTime:1.5, price:0, unlocked:true },
  p18c: { id:'p18c', name:'P18C', type:'pg', damage:12, fireRate:800, magazine:17, reserveAmmo:34, range:40, recoilVertical:1.2, recoilHorizontal:0.8, spread:2.5, auto:true, adsZoom:1.2, pellets:1, reloadTime:1.3, price:200, unlocked:false },
  ump45: { id:'ump45', name:'UMP45', type:'smg', damage:22, fireRate:550, magazine:25, reserveAmmo:75, range:60, recoilVertical:1.8, recoilHorizontal:0.6, spread:3, auto:true, adsZoom:1.4, pellets:1, reloadTime:2.2, price:400, unlocked:false },
  vector: { id:'vector', name:'Vector', type:'smg', damage:16, fireRate:1100, magazine:19, reserveAmmo:57, range:50, recoilVertical:0.8, recoilHorizontal:0.3, spread:2.5, auto:true, adsZoom:1.4, pellets:1, reloadTime:2.0, price:600, unlocked:false },
  m416: { id:'m416', name:'M416', type:'ar', damage:28, fireRate:700, magazine:30, reserveAmmo:90, range:120, recoilVertical:2.0, recoilHorizontal:0.8, spread:1.5, auto:true, adsZoom:1.6, pellets:1, reloadTime:2.3, price:800, unlocked:false },
  akm: { id:'akm', name:'AKM', type:'ar', damage:35, fireRate:600, magazine:30, reserveAmmo:90, range:100, recoilVertical:3.0, recoilHorizontal:1.5, spread:2, auto:true, adsZoom:1.5, pellets:1, reloadTime:2.5, price:700, unlocked:false },
  scar_l: { id:'scar_l', name:'SCAR-L', type:'ar', damage:26, fireRate:620, magazine:30, reserveAmmo:90, range:110, recoilVertical:1.5, recoilHorizontal:0.4, spread:1.2, auto:true, adsZoom:1.6, pellets:1, reloadTime:2.3, price:900, unlocked:false },
  s12k: { id:'s12k', name:'S12K', type:'sg', damage:18, fireRate:300, magazine:5, reserveAmmo:20, range:25, recoilVertical:4, recoilHorizontal:2, spread:5, auto:false, adsZoom:1.2, pellets:6, reloadTime:3.0, price:500, unlocked:false },
  s686: { id:'s686', name:'S686', type:'sg', damage:22, fireRate:150, magazine:2, reserveAmmo:12, range:20, recoilVertical:5, recoilHorizontal:2, spread:6, auto:false, adsZoom:1.1, pellets:9, reloadTime:2.5, price:450, unlocked:false },
  kar98k: { id:'kar98k', name:'Kar98k', type:'sr', damage:75, fireRate:1500, magazine:5, reserveAmmo:15, range:250, recoilVertical:6, recoilHorizontal:1, spread:0.5, auto:false, adsZoom:3.0, pellets:1, reloadTime:2.8, price:1000, unlocked:false },
  awm: { id:'awm', name:'AWM', type:'sr', damage:120, fireRate:1800, magazine:5, reserveAmmo:10, range:300, recoilVertical:8, recoilHorizontal:1.5, spread:0.3, auto:false, adsZoom:4.0, pellets:1, reloadTime:3.5, price:1500, unlocked:false }
};

// ---------- WEAPON CONTROLLER ----------
const weaponController = {
  currentWeapon: null,
  currentAmmo: 0,
  currentReserve: 0,
  isReloading: false,
  reloadTimer: 0,
  isFiring: false,
  lastShotTime: 0,
  recoilOffsetX: 0,
  recoilOffsetY: 0,
  spreadRecovery: 0,
  weaponModel: null,
  muzzleFlash: null,
  tracerGroup: null,

  switchWeapon(weaponId) {
    if (!Game.player.weapons.includes(weaponId)) return;
    const wpn = WEAPONS[weaponId];
    if (!wpn) return;
    // Save current ammo
    if (this.currentWeapon) {
      this.currentWeapon._currentAmmo = this.currentAmmo;
      this.currentWeapon._currentReserve = this.currentReserve;
    }
    this.currentWeapon = wpn;
    this.currentAmmo = wpn._currentAmmo !== undefined ? wpn._currentAmmo : wpn.magazine;
    this.currentReserve = wpn._currentReserve !== undefined ? wpn._currentReserve : wpn.reserveAmmo;
    this.isReloading = false;
    this._createWeaponModel(wpn.type);
    Game.player.equippedWeapon = weaponId;
    uiSystem.showMessage(wpn.name, 1000, '#ffcc00');
  },

  fire() {
    if (!this.currentWeapon || this.isReloading) return;
    const now = performance.now();
    const wpn = this.currentWeapon;
    if (now - this.lastShotTime < 1000 / (wpn.fireRate / 60)) return;
    if (this.currentAmmo <= 0) {
      if (this.currentReserve > 0) this.reload();
      else AudioSystem.playHurt(); // click
      return;
    }
    this.lastShotTime = now;
    this.currentAmmo--;
    AudioSystem.playGunshot(wpn.type);

    // Spread calculation
    let spread = wpn.spread;
    if (Game.isADS) spread *= 0.3;
    if (Game.player.isSprinting) spread *= 2;
    if (Game.player.velocity.length() > 0.1) spread *= 1.5;

    // Fire pellets
    for (let i = 0; i < wpn.pellets; i++) {
      this._fireRay(wpn, spread);
    }

    // Recoil
    this.recoilOffsetY += wpn.recoilVertical * 0.005;
    this.recoilOffsetX += (Math.random() - 0.5) * wpn.recoilHorizontal * 0.005;
    this.spreadRecovery = 0;

    // Muzzle flash
    this._showMuzzleFlash();

    // Auto-fire
    if (wpn.auto && Game.mouse.leftDown) {
      this.isFiring = true;
    } else {
      this.isFiring = false;
    }
  },

  _fireRay(wpn, spread) {
    const raycaster = new THREE.Raycaster();
    const dir = new THREE.Vector3();
    Game.camera.getWorldDirection(dir);
    // Apply spread
    const spreadRad = spread * Math.PI / 180;
    dir.x += (Math.random() - 0.5) * Math.tan(spreadRad);
    dir.y += (Math.random() - 0.5) * Math.tan(spreadRad);
    dir.z += (Math.random() - 0.5) * Math.tan(spreadRad);
    dir.normalize();
    raycaster.set(Game.camera.position, dir);
    raycaster.far = wpn.range;

    // Check monster hits
    let hitMonster = null;
    let hitDist = wpn.range;
    let hitPoint = null;
    let isHeadshot = false;

    for (let m of Game.monsters) {
      if (m.state === 'dead') continue;
      if (!m.mesh) continue;
      const hits = raycaster.intersectObject(m.mesh, true);
      if (hits.length > 0 && hits[0].distance < hitDist) {
        hitDist = hits[0].distance;
        hitMonster = m;
        hitPoint = hits[0].point;
        // Check headshot
        if (m.headMesh && hits[0].object === m.headMesh) isHeadshot = true;
        else if (hits[0].point.y > m.position.y + m.headHeight) isHeadshot = true;
      }
    }

    // Check wall hits (for tracer endpoint)
    let wallHit = null;
    const wallObjs = Game.scene.children.filter(o => o.isMesh && !o.userData.item && !o.userData.monster);
    const wallHits = raycaster.intersectObjects(wallObjs, false);
    if (wallHits.length > 0 && wallHits[0].distance < hitDist) {
      hitDist = wallHits[0].distance;
      hitMonster = null;
      hitPoint = wallHits[0].point;
    }

    // Damage
    if (hitMonster) {
      let dmg = wpn.damage;
      // Distance falloff
      const effRange = wpn.range;
      if (hitDist > effRange * 0.7) {
        dmg *= Math.max(0.3, 1 - (hitDist - effRange * 0.7) / (effRange * 0.3));
      }
      // Headshot
      if (isHeadshot) dmg *= 2;
      // Sniper penetration
      hitMonster.takeDamage(Math.round(dmg), isHeadshot, wpn.type);
      // Blood effect
      if (hitPoint) this._showBloodEffect(hitPoint);
    }

    // Tracer
    const start = Game.camera.position.clone();
    const end = hitPoint || start.clone().add(dir.multiplyScalar(wpn.range));
    this._showTracer(start, end);
  },

  reload() {
    if (!this.currentWeapon || this.isReloading) return;
    if (this.currentAmmo >= this.currentWeapon.magazine) return;
    if (this.currentReserve <= 0) return;
    this.isReloading = true;
    this.reloadTimer = this.currentWeapon.reloadTime / (rpgSystem.reloadSpeed || 1);
    AudioSystem.playReload();
  },

  update(delta) {
    // Recover recoil
    this.recoilOffsetY *= 0.85;
    this.recoilOffsetX *= 0.85;
    PlayerController.pitch -= this.recoilOffsetY;
    PlayerController.yaw -= this.recoilOffsetX;

    // Reload progress
    if (this.isReloading) {
      this.reloadTimer -= delta;
      if (this.reloadTimer <= 0) {
        const need = this.currentWeapon.magazine - this.currentAmmo;
        const take = Math.min(need, this.currentReserve);
        this.currentAmmo += take;
        this.currentReserve -= take;
        this.isReloading = false;
      }
    }

    // Auto fire
    if (this.isFiring && Game.mouse.leftDown && this.currentWeapon && this.currentWeapon.auto) {
      this.fire();
    }
    if (!Game.mouse.leftDown) this.isFiring = false;

    // Weapon model sway
    if (this.weaponModel) {
      const t = performance.now() * 0.001;
      const sway = Game.player.velocity.length() > 0.1 ? 0.02 : 0.005;
      this.weaponModel.position.x = 0.3 + Math.sin(t * 2) * sway;
      this.weaponModel.position.y = -0.3 + Math.cos(t * 2) * sway;
      this.weaponModel.position.z = -0.6;
      if (Game.isADS) {
        this.weaponModel.position.x *= 0.1;
        this.weaponModel.position.y *= 0.1;
        this.weaponModel.position.z = -0.3;
      }
      if (this.isReloading) {
        this.weaponModel.rotation.z = Math.sin(performance.now() * 0.01) * 0.3;
      } else {
        this.weaponModel.rotation.z = 0;
      }
    }
    // Muzzle flash fade
    if (this.muzzleFlash) {
      this.muzzleFlash.material.opacity *= 0.7;
      if (this.muzzleFlash.material.opacity < 0.05) this.muzzleFlash.visible = false;
    }
  },

  _createWeaponModel(type) {
    if (this.weaponModel) { Game.camera.remove(this.weaponModel); }
    const group = new THREE.Group();
    const matBody = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
    const matBarrel = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
    const matGrip = new THREE.MeshLambertMaterial({ color: 0x1a1208 });

    if (type === 'melee') {
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, 0.3), new THREE.MeshLambertMaterial({ color: 0xaaaabb }));
      blade.position.set(0.3, -0.25, -0.3);
      group.add(blade);
    } else if (type === 'pg') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.18), matBody);
      body.position.set(0, 0, 0); group.add(body);
      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, 0.06), matGrip);
      grip.position.set(0, -0.1, 0.05); group.add(grip);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.1, 6), matBarrel);
      barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.12); group.add(barrel);
    } else if (type === 'smg') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.25), matBody);
      body.position.set(0, 0, 0); group.add(body);
      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, 0.06), matGrip);
      grip.position.set(0, -0.11, 0.06); group.add(grip);
      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.12, 0.06), matBody);
      mag.position.set(0, -0.1, -0.02); group.add(mag);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.12, 6), matBarrel);
      barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.02, -0.16); group.add(barrel);
    } else if (type === 'ar') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.14, 0.35), matBody);
      body.position.set(0, 0, 0); group.add(body);
      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.14, 0.06), matGrip);
      grip.position.set(0, -0.12, 0.08); group.add(grip);
      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, 0.07), matBody);
      mag.position.set(0, -0.12, -0.03); group.add(mag);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.2, 6), matBarrel);
      barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.22); group.add(barrel);
      const stock = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.08, 0.12), matBody);
      stock.position.set(0, -0.02, 0.18); group.add(stock);
    } else if (type === 'sg') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.3), new THREE.MeshLambertMaterial({ color: 0x4a2810 }));
      body.position.set(0, 0, 0); group.add(body);
      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, 0.06), matGrip);
      grip.position.set(0, -0.11, 0.08); group.add(grip);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.25, 6), matBarrel);
      barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.02, -0.18); group.add(barrel);
    } else if (type === 'sr') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.4), matBody);
      body.position.set(0, 0, 0); group.add(body);
      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.13, 0.06), matGrip);
      grip.position.set(0, -0.12, 0.1); group.add(grip);
      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.08, 0.06), matBody);
      mag.position.set(0, -0.08, 0); group.add(mag);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.3, 6), matBarrel);
      barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.28); group.add(barrel);
      const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.12, 8), new THREE.MeshLambertMaterial({ color: 0x000000 }));
      scope.rotation.x = Math.PI/2; scope.position.set(0, 0.06, -0.05); group.add(scope);
    }

    group.position.set(0.3, -0.3, -0.6);
    Game.camera.add(group);
    this.weaponModel = group;

    // Muzzle flash
    const flashGeo = new THREE.PlaneGeometry(0.15, 0.15);
    const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0, side: THREE.DoubleSide });
    const flash = new THREE.Mesh(flashGeo, flashMat);
    flash.position.set(0, 0.03, -0.35);
    flash.visible = false;
    group.add(flash);
    this.muzzleFlash = flash;
  },

  _showMuzzleFlash() {
    if (!this.muzzleFlash) return;
    this.muzzleFlash.visible = true;
    this.muzzleFlash.material.opacity = 0.8;
    this.muzzleFlash.rotation.z = Math.random() * Math.PI;
  },

  _showTracer(start, end) {
    const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
    const mat = new THREE.LineBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.6 });
    const line = new THREE.Line(geo, mat);
    Game.scene.add(line);
    setTimeout(() => { Game.scene.remove(line); geo.dispose(); mat.dispose(); }, 50);
  },

  _showBloodEffect(pos) {
    const geo = new THREE.SphereGeometry(0.1, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color: 0x880000, transparent: true, opacity: 0.8 });
    const blood = new THREE.Mesh(geo, mat);
    blood.position.copy(pos);
    Game.scene.add(blood);
    setTimeout(() => { Game.scene.remove(blood); geo.dispose(); mat.dispose(); }, 300);
  }
};

// ---------- MONSTER TYPES ----------
const MONSTER_TYPES = {
  hound: { type:'hound', name:'猎犬', health:80, speed:6, damage:15, attackRange:1.5, detectRange:20, attackCooldown:1.0, expReward:20, coinReward:5, color:0x1a1a1a, size:0.8, eyeColor:0xff0000, behavior:'chase', headHeight:0.6 },
  stalker: { type:'stalker', name:'跟踪者', health:150, speed:0, damage:25, attackRange:1.8, detectRange:25, attackCooldown:1.5, expReward:35, coinReward:10, color:0x0a0a0a, size:1.0, eyeColor:0xffffff, behavior:'teleport', headHeight:1.5 },
  smiler: { type:'smiler', name:'微笑者', health:100, speed:0, damage:10, attackRange:3, detectRange:5, attackCooldown:0.1, expReward:15, coinReward:3, color:0x000000, size:0.5, eyeColor:0xffff00, behavior:'static', headHeight:1.6 },
  skinstealer: { type:'skinstealer', name:'皮囊窃取者', health:200, speed:4, damage:30, attackRange:1.8, detectRange:15, attackCooldown:1.5, expReward:40, coinReward:15, color:0x3a2a1a, size:1.0, eyeColor:0x00ff00, behavior:'ambush', headHeight:1.5 },
  partygoer: { type:'partygoer', name:'派对客', health:120, speed:3, damage:20, attackRange:1.5, detectRange:18, attackCooldown:1.2, expReward:30, coinReward:8, color:0xc4a847, size:1.0, eyeColor:0x0000ff, behavior:'lure', headHeight:1.5 }
};

// ---------- MONSTER CLASS ----------
class Monster {
  constructor(type, x, z, level) {
    const def = MONSTER_TYPES[type];
    if (!def) return;
    this.type = type;
    this.def = def;
    this.health = def.health + level * 10;
    this.maxHealth = this.health;
    this.position = new THREE.Vector3(x, 0, z);
    this.velocity = new THREE.Vector3();
    this.state = 'idle';
    this.target = null;
    this.lastAttack = 0;
    this.pathTimer = 0;
    this.moveDir = new THREE.Vector3();
    this.deathTimer = 0;
    this.hitFlash = 0;
    this.stunTimer = 0;
    this.isRaging = false;
    this.teleportTimer = 5 + Math.random() * 5;
    this.disguiseActive = (type === 'skinstealer');
    this.musicTimer = 0;
    this.headHeight = def.headHeight;
    this.headMesh = null;
    this.mesh = this._createModel();
    this.mesh.userData.monster = this;
    this.mesh.position.copy(this.position);
    Game.scene.add(this.mesh);
  }

  _createModel() {
    const def = this.def;
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: def.color });
    const eyeMat = new THREE.MeshBasicMaterial({ color: def.eyeColor });

    if (this.type === 'hound') {
      // Four-legged creature
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.9), bodyMat);
      body.position.y = 0.5; group.add(body);
      // Head
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), bodyMat);
      head.position.set(0, 0.65, -0.5); group.add(head);
      this.headMesh = head;
      // Eyes
      const eyeGeo = new THREE.SphereGeometry(0.05, 6, 6);
      const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.1, 0.7, -0.65); group.add(eL);
      const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.1, 0.7, -0.65); group.add(eR);
      // Legs
      for (let i = 0; i < 4; i++) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), bodyMat);
        leg.position.set(i < 2 ? -0.15 : 0.15, 0.2, i % 2 ? -0.3 : 0.3); group.add(leg);
      }
    } else if (this.type === 'stalker') {
      // Tall thin humanoid
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2.0, 8), bodyMat);
      body.position.y = 1.0; group.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), bodyMat);
      head.position.set(0, 2.1, 0); group.add(head);
      this.headMesh = head;
      // No face, just white eyes
      const eyeGeo = new THREE.SphereGeometry(0.04, 6, 6);
      const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.08, 2.15, -0.2); group.add(eL);
      const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.08, 2.15, -0.2); group.add(eR);
      // Long arms
      const armGeo = new THREE.CylinderGeometry(0.06, 0.08, 1.2, 6);
      const aL = new THREE.Mesh(armGeo, bodyMat); aL.position.set(-0.3, 1.2, 0); aL.rotation.z = 0.2; group.add(aL);
      const aR = new THREE.Mesh(armGeo, bodyMat); aR.position.set(0.3, 1.2, 0); aR.rotation.z = -0.2; group.add(aR);
    } else if (this.type === 'smiler') {
      // Dark cloud with smile
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), bodyMat);
      body.position.y = 1.6; group.add(body);
      this.headMesh = body;
      // Glowing smile (curve)
      const smileGeo = new THREE.TorusGeometry(0.2, 0.03, 4, 8, Math.PI);
      const smile = new THREE.Mesh(smileGeo, eyeMat);
      smile.position.set(0, 1.5, -0.4); smile.rotation.x = Math.PI; group.add(smile);
      // Eyes
      const eyeGeo = new THREE.SphereGeometry(0.06, 6, 6);
      const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.12, 1.7, -0.4); group.add(eL);
      const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.12, 1.7, -0.4); group.add(eR);
    } else if (this.type === 'skinstealer') {
      // Disguised as crate or humanoid
      if (this.disguiseActive) {
        const crate = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.7), new THREE.MeshLambertMaterial({ map: TextureFactory.crateTexture() }));
        crate.position.y = 0.3; group.add(crate);
      } else {
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.5, 0.4), bodyMat);
        body.position.y = 0.75; group.add(body);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), bodyMat);
        head.position.set(0, 1.6, 0); group.add(head);
        this.headMesh = head;
        const eyeGeo = new THREE.SphereGeometry(0.05, 6, 6);
        const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.08, 1.65, -0.18); group.add(eL);
        const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.08, 1.65, -0.18); group.add(eR);
      }
    } else if (this.type === 'partygoer') {
      // Yellow humanoid with party mask
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 1.3, 8), bodyMat);
      body.position.y = 0.65; group.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), bodyMat);
      head.position.set(0, 1.5, 0); group.add(head);
      this.headMesh = head;
      // Party hat
      const hat = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.3, 6), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
      hat.position.set(0, 1.85, 0); group.add(hat);
      // Mask eyes (happy)
      const eyeGeo = new THREE.SphereGeometry(0.05, 6, 6);
      const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.1, 1.55, -0.25); group.add(eL);
      const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.1, 1.55, -0.25); group.add(eR);
    }

    // Health bar sprite (hidden, shown on hit)
    return group;
  }

  update(delta, playerPos, walls) {
    if (this.state === 'dead') {
      this.deathTimer += delta;
      if (this.mesh) {
        this.mesh.rotation.z += delta * 2;
        this.mesh.position.y -= delta * 0.5;
        this.mesh.scale.multiplyScalar(1 - delta * 0.5);
      }
      return;
    }

    if (this.stunTimer > 0) {
      this.stunTimer -= delta;
      return;
    }

    const dist = this.position.distanceTo(playerPos);
    const def = this.def;

    // Hit flash recovery
    if (this.hitFlash > 0) {
      this.hitFlash -= delta * 5;
      this.mesh.traverse(o => { if (o.isMesh && o.material && o.material.emissive) o.material.emissive.setRGB(this.hitFlash, 0, 0); });
    }

    // Behavior
    switch (def.behavior) {
      case 'chase': this._behaviorChase(delta, playerPos, dist, walls); break;
      case 'teleport': this._behaviorTeleport(delta, playerPos, dist); break;
      case 'static': this._behaviorStatic(delta, playerPos, dist); break;
      case 'ambush': this._behaviorAmbush(delta, playerPos, dist, walls); break;
      case 'lure': this._behaviorLure(delta, playerPos, dist, walls); break;
    }

    // Update mesh position
    if (this.mesh) {
      this.mesh.position.copy(this.position);
      // Face player
      if (this.state === 'chase' || this.state === 'attack') {
        const dx = playerPos.x - this.position.x;
        const dz = playerPos.z - this.position.z;
        this.mesh.rotation.y = Math.atan2(dx, dz);
      }
    }

    // Partygoer SAN drain
    if (this.type === 'partygoer' && dist < 15) {
      horrorSystem.reduceSan(delta * 3);
      this.musicTimer += delta;
      if (this.musicTimer > 5) { this.musicTimer = 0; AudioSystem.playMonsterGrowl('partygoer'); }
    }

    // Smiler SAN drain
    if (this.type === 'smiler' && dist < 3 && !itemSystem.flashlightOn) {
      PlayerController.takeDamage(def.damage * delta);
    }
  }

  _behaviorChase(delta, playerPos, dist, walls) {
    const speed = this.isRaging ? this.def.speed * 1.5 : this.def.speed;
    if (dist < this.def.detectRange) {
      this.state = dist < this.def.attackRange ? 'attack' : 'chase';
      if (this.state === 'chase') {
        // Move toward player
        const dx = playerPos.x - this.position.x;
        const dz = playerPos.z - this.position.z;
        const len = Math.sqrt(dx*dx + dz*dz);
        if (len > 0.1) {
          const mx = (dx / len) * speed * delta;
          const mz = (dz / len) * speed * delta;
          // Simple collision
          if (!this._checkWall(this.position.x + mx, this.position.z, walls))
            this.position.x += mx;
          if (!this._checkWall(this.position.x, this.position.z + mz, walls))
            this.position.z += mz;
        }
      } else if (this.state === 'attack') {
        const now = performance.now() / 1000;
        if (now - this.lastAttack > this.def.attackCooldown) {
          this.lastAttack = now;
          PlayerController.takeDamage(this.def.damage);
          AudioSystem.playMonsterGrowl(this.type);
        }
      }
    } else {
      this.state = 'idle';
    }
  }

  _behaviorTeleport(delta, playerPos, dist) {
    // Weeping Angel: don't move when player looks at it
    const camDir = new THREE.Vector3();
    Game.camera.getWorldDirection(camDir);
    const toMonster = new THREE.Vector3().subVectors(this.position, Game.camera.position).normalize();
    const dot = camDir.dot(toMonster);
    const lookingAt = dot > 0.7 && dist < this.def.detectRange;

    // Flashlight check
    if (itemSystem.flashlightOn && dist < 10) {
      // Slowed
      this.stunTimer = 0.2;
    }

    if (lookingAt) {
      this.state = 'frozen';
      return;
    }

    // Teleport logic
    this.teleportTimer -= delta;
    if (this.teleportTimer <= 0 || dist < this.def.attackRange) {
      this.teleportTimer = 4 + Math.random() * 4;
      // Teleport behind or beside player
      const angle = Math.random() * Math.PI * 2;
      const teleDist = 5 + Math.random() * 5;
      const tx = playerPos.x + Math.cos(angle) * teleDist;
      const tz = playerPos.z + Math.sin(angle) * teleDist;
      this.position.set(tx, 0, tz);
      AudioSystem.playMonsterGrowl('stalker');
      this.state = 'chase';
    }

    if (dist < this.def.attackRange) {
      const now = performance.now() / 1000;
      if (now - this.lastAttack > this.def.attackCooldown) {
        this.lastAttack = now;
        PlayerController.takeDamage(this.def.damage);
        // Teleport away after attack
        this.teleportTimer = 2;
        const angle = Math.random() * Math.PI * 2;
        const teleDist = 8 + Math.random() * 5;
        this.position.set(playerPos.x + Math.cos(angle) * teleDist, 0, playerPos.z + Math.sin(angle) * teleDist);
      }
    }
  }

  _behaviorStatic(delta, playerPos, dist) {
    if (dist < this.def.detectRange) {
      // Check if flashlight is on and pointing at it
      if (itemSystem.flashlightOn && dist < 8) {
        const camDir = new THREE.Vector3();
        Game.camera.getWorldDirection(camDir);
        const toMonster = new THREE.Vector3().subVectors(this.position, Game.camera.position).normalize();
        if (camDir.dot(toMonster) > 0.5) {
          // Disappear
          this.state = 'stunned';
          this.stunTimer = 3;
          if (this.mesh) this.mesh.visible = false;
          setTimeout(() => { if (this.mesh && this.state !== 'dead') this.mesh.visible = true; }, 3000);
          return;
        }
      }
      // Damage player in range
      if (dist < 3 && !itemSystem.flashlightOn) {
        PlayerController.takeDamage(this.def.damage * delta);
        this.state = 'attack';
      }
    } else {
      this.state = 'idle';
    }
  }

  _behaviorAmbush(delta, playerPos, dist, walls) {
    if (this.disguiseActive && dist < 2.5) {
      // Reveal!
      this.disguiseActive = false;
      // Replace model
      Game.scene.remove(this.mesh);
      this.mesh = this._createModel();
      this.mesh.userData.monster = this;
      this.mesh.position.copy(this.position);
      Game.scene.add(this.mesh);
      AudioSystem.playMonsterGrowl('skinstealer');
      this.state = 'chase';
      uiSystem.showMessage('那不是箱子！', 2000, '#ff0000');
    }
    if (!this.disguiseActive) {
      this._behaviorChase(delta, playerPos, dist, walls);
    }
  }

  _behaviorLure(delta, playerPos, dist, walls) {
    // Always chase, but slower
    if (dist < this.def.detectRange) {
      this.state = 'chase';
      const speed = this.def.speed;
      const dx = playerPos.x - this.position.x;
      const dz = playerPos.z - this.position.z;
      const len = Math.sqrt(dx*dx + dz*dz);
      if (len > 0.1) {
        const mx = (dx / len) * speed * delta;
        const mz = (dz / len) * speed * delta;
        if (!this._checkWall(this.position.x + mx, this.position.z, walls))
          this.position.x += mx;
        if (!this._checkWall(this.position.x, this.position.z + mz, walls))
          this.position.z += mz;
      }
      if (dist < this.def.attackRange) {
        const now = performance.now() / 1000;
        if (now - this.lastAttack > this.def.attackCooldown) {
          this.lastAttack = now;
          PlayerController.takeDamage(this.def.damage);
        }
      }
    }
  }

  _checkWall(x, z, walls) {
    if (!walls) return false;
    for (let w of walls) {
      if (!w.isCollision) continue;
      const dx = Math.abs(x - w.x) - w.width/2 - 0.4;
      const dz = Math.abs(z - w.z) - w.depth/2 - 0.4;
      if (dx < 0 && dz < 0) return true;
    }
    return false;
  }

  takeDamage(amount, isHeadshot, damageType) {
    let dmg = amount;
    // Weakness checks
    if (this.type === 'skinstealer' && damageType === 'fire') dmg *= 2;
    if (isHeadshot) dmg *= 1.5;
    this.health -= dmg;
    this.hitFlash = 1;
    // Rage for hounds when nearby hound dies
    if (this.type === 'hound' && this.health <= 0) {
      for (let m of Game.monsters) {
        if (m.type === 'hound' && m !== this && m.state !== 'dead') {
          m.isRaging = true;
        }
      }
    }
    if (this.health <= 0) {
      this.die();
    } else {
      // Reveal skinstealer if hit
      if (this.type === 'skinstealer' && this.disguiseActive) {
        this.disguiseActive = false;
        Game.scene.remove(this.mesh);
